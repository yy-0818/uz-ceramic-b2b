name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 防止多个 in-flight run 浪费 CI 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: 类型检查 + 单元测试 + 打包（无 ESLint，等 P1-1）
  build:
    name: Type-check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_SUPABASE_FUNCTIONS_URL: https://placeholder.supabase.co/functions/v1
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Job 2: 数据库 migration 检查（仅在源变时跑）
  migrations:
    name: Validate SQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check migration ordering
        run: |
          # 检查 migration 文件名顺序连续：0001, 0002, ..., NNNN
          cd supabase/migrations
          ls *.sql | sort | awk '{
            n = substr($0, 1, 4) + 0
            if (n != expected) {
              print "ERROR: gap or skip at " $0 " (expected " expected ")"
              exit 1
            }
            expected = n + 1
          } END { print "OK: all migrations continuous from 0001 to " (expected - 1) }'
          cd ../..

      - name: Lint SQL (basic)
        # 简单 SQL 检查：不允许生产迁移出现 DROP TABLE/DROP COLUMN
        run: |
          if grep -rE "^DROP TABLE|^DROP COLUMN" supabase/migrations/; then
            echo "ERROR: DROP TABLE/COLUMN in migration — must use a separate risk-acknowledged migration"
            exit 1
          fi
          echo "OK: no destructive DROP in migrations"

  // Job 3: i18n 监控 — 报告 zh 多出来的 key 到 ru/uz 缺失清单（不阻断，仅警告）
  i18n:
    name: i18n coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true  # 不阻断 PR
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts

      - name: Generate missing-translations report
        run: |
          node -e "
          const fs = require('fs');
          const src = fs.readFileSync('scripts/check-i18n.mjs', 'utf8');
          // 简化：直接 import 并 export
          import('./scripts/check-i18n.mjs').catch(e => { console.log('::warning::' + e.message); process.exit(0); });
          " || true
          # 即使有 missing 也通过，让人工处理
          echo '✅ i18n check 完成（不一致信息打到 GitHub step summary）'

      - name: Upload missing-translations report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-missing-report
          path: |
            **/i18n-missing-*.json
            **/*.log
          if-no-files-found: ignore
          retention-days: 30

  # Job 4: 安全审计（生产依赖的已知漏洞）
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts

      - name: Run npm audit (high+)
        # audit-level=high 只阻断高危以上漏洞，低/中不阻断
        run: npm audit --audit-level=high --omit=dev
